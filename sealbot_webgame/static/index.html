<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>SealBot 登入 / 註冊</title>
</head>
<body>
  <h1>SealBot 小海豹遊戲 - 登入 / 註冊</h1>

  <section>
    <h2>註冊帳號</h2>
    <input id="reg_username" placeholder="使用者名稱" />
    <input id="reg_password" type="password" placeholder="密碼" />
    <button onclick="register()">註冊</button>
  </section>

  <hr />

  <section>
    <h2>登入帳號</h2>
    <input id="login_username" placeholder="使用者名稱" />
    <input id="login_password" type="password" placeholder="密碼" />
    <button onclick="login()">登入</button>
  </section>

  <pre id="output" style="background:#f0f0f0; padding:1em;"></pre>

  <script>
    async function register() {
      const username = document.getElementById("reg_username").value;
      const password = document.getElementById("reg_password").value;

      const res = await fetch("/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username, password })
      });

      const result = await res.text();
      document.getElementById("output").textContent = "📥 註冊結果:\n" + result;
    }

    async function login() {
      const username = document.getElementById("login_username").value;
      const password = document.getElementById("login_password").value;

      const res = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        const data = await res.json();
        localStorage.setItem("user_id", data.user_id);
        localStorage.setItem("username", data.username);
        window.location.href = "game.html";  // 登入成功跳轉
      } else {
        document.getElementById("output").textContent = "❌ 登入失敗，請確認帳號密碼";
      }
    }
  </script>
</body>
</html>
